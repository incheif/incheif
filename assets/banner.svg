.kr0{opacity:0;animation:kr0 12.0s infinite}
@keyframes kr1{0%,20.83%{opacity:0}22.83%,88%{opacity:1}94%,100%{opacity:0}}
.kr1{opacity:0;animation:kr1 12.0s infinite}
@keyframes ks1{0%,25.83%{opacity:0}27.83%,88%{opacity:1}94%,100%{opacity:0}}
.ks1{opacity:0;animation:ks1 12.0s infinite}
@keyframes kr2{0%,33.33%{opacity:0}35.33%,88%{opacity:1}94%,100%{opacity:0}}
