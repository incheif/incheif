<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF; #8B5CF6; #EC4899; #00F0FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6; #EC4899; #00F0FF; #8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#EC4899; #00F0FF; #8B5CF6; #EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="30" cy="30" r="0.75" fill="#38BDF8" fill-opacity="0.15"/>
    </pattern>

    <style>
      @keyframes pulseAnim {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .node-pulse {
        animation: pulseAnim 4s ease-in-out infinite;
      }
      .beam-line {
        stroke-dasharray: 60, 200;
        animation: beamMove 5s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
      }
      .mono-text {
        font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="250" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="250" rx="16" fill="url(#cornerGlow)"/>
  <rect width="900" height="250" rx="16" fill="url(#centerGlow)"/>
  <rect width="900" height="250" rx="16" fill="url(#cyberGrid)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="897" height="247" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Accent Beam -->
  <line x1="80" y1="2" x2="350" y2="2" stroke="#00F0FF" stroke-width="2" filter="url(#subtleGlow)" class="beam-line"/>
  <line x1="550" y1="248" x2="820" y2="248" stroke="#8B5CF6" stroke-width="2" filter="url(#subtleGlow)" class="beam-line"/>

  <!-- Decorative Circuitry / Neural Nodes (Left & Right) -->
  <g opacity="0.6">
    <!-- Left Network -->
    <path d="M 30 70 L 70 70 L 100 100 L 100 150 L 70 180 L 30 180" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="70" cy="70" r="3" fill="#00F0FF" class="node-pulse"/>
    <circle cx="100" cy="100" r="2.5" fill="#8B5CF6"/>
    <circle cx="100" cy="150" r="2.5" fill="#3B82F6"/>
    <circle cx="70" cy="180" r="3" fill="#EC4899" class="node-pulse"/>
    <line x1="70" y1="70" x2="100" y2="150" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Right Network -->
    <path d="M 870 70 L 830 70 L 800 100 L 800 150 L 830 180 L 870 180" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="830" cy="70" r="3" fill="#8B5CF6" class="node-pulse"/>
    <circle cx="800" cy="100" r="2.5" fill="#00F0FF"/>
    <circle cx="800" cy="150" r="2.5" fill="#EC4899"/>
    <circle cx="830" cy="180" r="3" fill="#00F0FF" class="node-pulse"/>
    <line x1="830" y1="70" x2="800" y2="150" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>

  <!-- Status Chip Top Center -->
  <g transform="translate(340, 26)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#0D1527" stroke="#1E293B" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#10B981" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="16" fill="#94A3B8" font-size="10.5" font-weight="600" class="mono-text" letter-spacing="1">SYSTEMS : OPERATIONAL</text>
  </g>

  <!-- Terminal Prefix -->
  <g transform="translate(0, 75)">
    <text x="450" y="0" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="600" class="mono-text" letter-spacing="3" opacity="0.9">
      &lt; AI ENGINEER &amp; SYSTEMS ARCHITECT &gt;
    </text>
  </g>

  <!-- Main Hero Name -->
  <g transform="translate(0, 126)">
    <!-- Glow Layer -->
    <text x="450" y="0" text-anchor="middle" fill="url(#cyberGrad)" font-size="44" class="title-text" filter="url(#neonGlow)" opacity="0.5">
      DHRUV GUPTA
    </text>
    <!-- Crisp Foreground Text -->
    <text x="450" y="0" text-anchor="middle" fill="url(#cyberGrad)" font-size="44" class="title-text">
      DHRUV GUPTA
    </text>
  </g>

  <!-- Subtitle Narrative -->
  <g transform="translate(0, 158)">
    <text x="450" y="0" text-anchor="middle" fill="#E2E8F0" font-size="14.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">
      AGENTIC AI  •  PHYSICAL INTELLIGENCE  •  EMBODIED ROBOTICS
    </text>
  </g>

  <!-- Tags / Specialization Pills -->
  <g transform="translate(160, 192)">
    <!-- Pill 1: Agentic Workflows -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="600" class="mono-text">⚡ AGENTIC AI</text>
    </g>

    <!-- Pill 2: Embodied Robotics -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="72.5" y="18" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="600" class="mono-text">🤖 PHYSICAL AI</text>
    </g>

    <!-- Pill 3: Multimodal RAG -->
    <g transform="translate(305, 0)">
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#0F172A" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="67.5" y="18" text-anchor="middle" fill="#F472B6" font-size="11" font-weight="600" class="mono-text">🧠 NEURAL RAG</text>
    </g>

    <!-- Pill 4: Temporal / Distributed -->
    <g transform="translate(455, 0)">
      <rect x="0" y="0" width="125" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="62.5" y="18" text-anchor="middle" fill="#67E8F9" font-size="11" font-weight="600" class="mono-text">🌐 SCALABLE SYS</text>
    </g>
  </g>
</svg>
