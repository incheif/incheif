<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
  <defs>
    <style>
      .card { fill: #0d131f; stroke: #1e293b; stroke-width: 1.2; rx: 14; transition: all 0.3s ease; }
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #94a3b8; text-anchor: middle; }
    </style>
  </defs>

  <!-- 1: Python -->
  <g transform="translate(0, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 16) scale(1.33)">
      <path fill="#38bdf8" d="M11.9 0C5.5 0 5.9 2.8 5.9 2.8l.01 2.9h6.1v.9H3.7S0 6.2 0 12.5c0 6.4 3.3 6.2 3.3 6.2h2v-2.9s-.1-3.4 3.4-3.4h5.9s3.3.1 3.3-3.2V3.2S18.3 0 11.9 0zm-3.3 1.9c.7 0 1.2.5 1.2 1.2 0 .7-.5 1.2-1.2 1.2-.6 0-1.2-.5-1.2-1.2 0-.7.6-1.2 1.2-1.2z"/>
      <path fill="#f1f5f9" opacity="0.9" d="M12.1 24c6.4 0 6-2.8 6-2.8l-.01-2.9H12v-.9h8.3s3.7.4 3.7-5.9c0-6.4-3.3-6.2-3.3-6.2h-2v2.9s.1 3.4-3.4 3.4H9.4s-3.3-.1-3.3 3.2v5.9s-.4 3.2 6 3.2zm3.3-1.9c-.7 0-1.2-.5-1.2-1.2 0-.7.5-1.2 1.2-1.2.6 0 1.2.5 1.2 1.2 0 .7-.6 1.2-1.2 1.2z"/>
    </g>
    <text class="lbl" x="32" y="86">Python</text>
  </g>

  <!-- 2: C++ -->
  <g transform="translate(86, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 16)">
      <!-- Blue C++ Hexagon with ++ -->
      <polygon fill="#0284c7" points="16,2 30,10 30,26 16,34 2,26 2,10" />
      <path fill="#ffffff" d="M17 11a7 7 0 1 0 0 14 7 7 0 0 0 5-2.2l-2-1.8A4.2 4.2 0 1 1 17 14c1.2 0 2.2.5 3 1.3l2-1.8A7 7 0 0 0 17 11z"/>
      <rect x="22" y="15" width="2" height="6" fill="#f8fafc"/>
      <rect x="20" y="17" width="6" height="2" fill="#f8fafc"/>
      <rect x="27" y="15" width="2" height="6" fill="#f8fafc"/>
      <rect x="25" y="17" width="6" height="2" fill="#f8fafc"/>
    </g>
    <text class="lbl" x="32" y="86">C++</text>
  </g>

  <!-- 3: PyTorch -->
  <g transform="translate(172, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(18, 16)">
      <path fill="#ef4444" d="M17.5 1.2l-2 2a9.5 9.5 0 1 0 7.8 7.8l2-2a12.3 12.3 0 1 1-7.8-7.8zm4.4 2.8a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/>
    </g>
    <text class="lbl" x="32" y="86">PyTorch</text>
  </g>

  <!-- 4: ROS 2 -->
  <g transform="translate(258, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 16)">
      <circle cx="8" cy="8" r="4.5" fill="#38bdf8"/>
      <circle cx="24" cy="8" r="4.5" fill="#38bdf8"/>
      <circle cx="16" cy="16" r="5" fill="#f8fafc"/>
      <circle cx="8" cy="24" r="4.5" fill="#38bdf8"/>
      <circle cx="24" cy="24" r="4.5" fill="#38bdf8"/>
      <line x1="8" y1="8" x2="24" y2="24" stroke="#64748b" stroke-width="1.5"/>
      <line x1="24" y1="8" x2="8" y2="24" stroke="#64748b" stroke-width="1.5"/>
    </g>
    <text class="lbl" x="32" y="86">ROS 2</text>
  </g>

  <!-- 5: Three.js (Spatial & Kinematics) -->
  <g transform="translate(344, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 16)">
      <polygon fill="#f8fafc" points="16,2 30,26 2,26"/>
      <polygon fill="#0d131f" points="16,9 25,23 7,23"/>
      <polygon fill="#38bdf8" points="16,14 22,23 10,23"/>
    </g>
    <text class="lbl" x="32" y="86">Three.js</text>
  </g>

  <!-- 6: Temporal -->
  <g transform="translate(430, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(17, 16)">
      <!-- Temporal Wave / Prism -->
      <path fill="#818cf8" d="M15 2L3 9v14l12 7 12-7V9L15 2zm9 18.8l-9 5.2-9-5.2V11l9 5.2 9-5.2v9.8z"/>
      <polygon fill="#38bdf8" points="15,6 7,11 15,16 23,11"/>
    </g>
    <text class="lbl" x="32" y="86">Temporal</text>
  </g>

  <!-- 7: FastAPI -->
  <g transform="translate(516, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(17, 16)">
      <circle cx="15" cy="15" r="14" fill="#009688"/>
      <path fill="#ffffff" d="M16 4L7 17h6l-2 9 10-14h-6l3-8z"/>
    </g>
    <text class="lbl" x="32" y="86">FastAPI</text>
  </g>

  <!-- 8: Next.js -->
  <g transform="translate(602, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(17, 16)">
      <circle cx="15" cy="15" r="14" fill="#000000" stroke="#334155" stroke-width="1.2"/>
      <path fill="#f8fafc" d="M20.5 22.5L11.8 11H9.5v10h2.2v-7.1l7.6 9.8c.4-.4.8-.8 1.2-1.2zm-.3-11.5h-2.2v5.6l2.2 2.8V11z"/>
    </g>
    <text class="lbl" x="32" y="86">Next.js</text>
  </g>

  <!-- 9: Docker -->
  <g transform="translate(688, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 17)">
      <rect x="7" y="10" width="4" height="3.5" rx="0.5" fill="#38bdf8"/>
      <rect x="12" y="10" width="4" height="3.5" rx="0.5" fill="#38bdf8"/>
      <rect x="17" y="10" width="4" height="3.5" rx="0.5" fill="#38bdf8"/>
      <rect x="12" y="6" width="4" height="3.5" rx="0.5" fill="#38bdf8"/>
      <rect x="17" y="6" width="4" height="3.5" rx="0.5" fill="#38bdf8"/>
      <path fill="#38bdf8" d="M29.5 14.5c-.5-.4-1.5-.5-2.2-.2-.3-.8-1-1.3-1.8-1.5-.1 0-.1 0 0 0-.2-1.8-1.5-2-1.5-2s-.8 1.2-.6 2.5c-.6.3-1.2.7-1.8 1.2H2.5c-.8 0-1.5.7-1.5 1.5 0 4.2 3.2 8.5 9 8.5 6.8 0 11.5-4 12.8-8.5 1.8 0 3-.9 3.5-1.8-.7-.4-1.5-.3-2.3-.2-.5-1.5-2.5-1.2-2.5-1.2v1.7z"/>
    </g>
    <text class="lbl" x="32" y="86">Docker</text>
  </g>

  <!-- 10: FAISS / Elasticsearch -->
  <g transform="translate(774, 0)">
    <rect class="card" x="0.5" y="0.5" width="64" height="64" />
    <g transform="translate(16, 16)">
      <!-- Neural Index Graph -->
      <circle cx="16" cy="7" r="3.5" fill="#38bdf8"/>
      <circle cx="6" cy="18" r="3.5" fill="#818cf8"/>
      <circle cx="26" cy="18" r="3.5" fill="#818cf8"/>
      <circle cx="11" cy="26" r="3" fill="#38bdf8"/>
      <circle cx="21" cy="26" r="3" fill="#38bdf8"/>
      <line x1="16" y1="7" x2="6" y2="18" stroke="#475569" stroke-width="1.5"/>
      <line x1="16" y1="7" x2="26" y2="18" stroke="#475569" stroke-width="1.5"/>
      <line x1="6" y1="18" x2="11" y2="26" stroke="#475569" stroke-width="1.5"/>
      <line x1="26" y1="18" x2="21" y2="26" stroke="#475569" stroke-width="1.5"/>
      <line x1="11" y1="26" x2="21" y2="26" stroke="#475569" stroke-width="1.5"/>
    </g>
    <text class="lbl" x="32" y="86">FAISS / RAG</text>
  </g>
</svg>
